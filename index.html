<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#173d34" />
  <meta name="description" content="ShareCapsule Prepare builds adaptive academic, interview, and campus placement preparation plans around your target date." />
  <title>ShareCapsule Prepare</title>
  <link rel="icon" type="image/svg+xml" sizes="any" href="/sharecapsule-logo.svg" />
  <link rel="shortcut icon" href="/sharecapsule-logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/adaptive.css" />
  <link rel="stylesheet" href="/campus.css" />
  <link rel="stylesheet" href="/report.css" />
  <link rel="stylesheet" href="/brand.css" />
  <script type="importmap">
    {
      "imports": {
        "./target-model.js": "/target-model-v2.js?v=20260812-1732"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <main style="max-width:760px;margin:72px auto;padding:24px;font-family:system-ui,sans-serif">
      <strong>ShareCapsule Prepare</strong>
      <p>Loading preparation workspace…</p>
    </main>
  </div>
  <script type="module">
    const app = document.querySelector('#app')
    const build = '20260812-1732'

    function showBootError(error) {
      console.error('ShareCapsule Prepare failed to start', error)
      const message = error instanceof Error ? error.message : String(error || 'Unknown module error')
      app.innerHTML = `
        <main style="max-width:760px;margin:72px auto;padding:24px;font-family:system-ui,sans-serif;line-height:1.5">
          <strong style="font-size:20px">ShareCapsule Prepare</strong>
          <h1 style="font-size:28px;margin:18px 0 8px">The application could not start.</h1>
          <p>Hosting is reachable, but a browser module failed to load. This diagnostic is shown instead of a blank page.</p>
          <pre style="white-space:pre-wrap;overflow-wrap:anywhere;padding:14px;border:1px solid #d7ddd9;border-radius:10px;background:#f7f9f8">${message.replace(/[&<>]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</pre>
          <p>Refresh once. If this remains visible, copy the error above.</p>
        </main>`
    }

    try {
      await import(`/app.js?v=${build}`)
    } catch (error) {
      showBootError(error)
      throw error
    }

    for (const moduleName of ['brand.js', 'live-research-ui.js', 'report-ui.js']) {
      import(`/${moduleName}?v=${build}`).catch((error) => {
        console.error(`Optional module ${moduleName} failed`, error)
      })
    }
  </script>
</body>
</html>
